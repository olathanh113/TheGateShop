<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>404 — Không tìm thấy trang | The Gate VNXK</title>
  <!-- Favicons -->
  <link rel="icon" type="image/x-icon" href="favicon.ico?v=4" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png?v=4" />
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png?v=4" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=4" />
  <link rel="manifest" href="site.webmanifest" />
  <meta name="theme-color" content="#f24c32" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/base.css" />
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--color-bg);
      text-align: center;
      padding: 2rem;
    }
    .error-page { max-width: 540px; }
    .error-page__code {
      font-family: var(--font-heading);
      font-size: clamp(6rem, 20vw, 12rem);
      font-weight: 800;
      line-height: 1;
      background: var(--gradient-gold);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 1rem;
    }
    .error-page__title {
      font-size: var(--fs-h3);
      margin-bottom: 1rem;
      color: var(--color-text-primary);
    }
    .error-page__desc {
      color: var(--color-text-secondary);
      margin-bottom: 2.5rem;
      line-height: 1.8;
    }
    .error-page__actions {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 0.75rem 2rem;
      font-size: 0.875rem; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.1em;
      border-radius: 4px; transition: all 0.3s ease;
      cursor: pointer; text-decoration: none;
    }
    .btn-primary {
      background: linear-gradient(135deg, #c9a96e 0%, #d4b97a 50%, #a88a4e 100%);
      color: #0a0a0a;
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(201,169,110,0.3); }
    .btn-secondary {
      background: transparent; color: var(--color-gold);
      border: 1px solid var(--color-gold);
    }
    .btn-secondary:hover { background: var(--color-gold); color: #0a0a0a; }
  </style>
</head>
<body>
  <div class="error-page">
    <div class="error-page__code">404</div>
    <h1 class="error-page__title">Trang không tồn tại</h1>
    <p class="error-page__desc">
      Có vẻ đường link bạn truy cập không còn tồn tại hoặc đã được chuyển sang vị trí khác.<br />
      Hãy quay lại trang chủ hoặc liên hệ với chúng tôi để được hỗ trợ.
    </p>
    <div class="error-page__actions">
      <a href="/" class="btn btn-primary">← Về trang chủ</a>
      <a href="https://www.facebook.com/thegatevietnamxk" target="_blank" rel="noopener noreferrer" class="btn btn-secondary">Chat hỗ trợ</a>
    </div>
  </div>
</body>
</html>
