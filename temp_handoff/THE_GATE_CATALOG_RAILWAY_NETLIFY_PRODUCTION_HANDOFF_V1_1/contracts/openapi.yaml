{
  "openapi": "3.1.0",
  "info": {
    "title": "The Gate Product Catalog API",
    "version": "2.0.1-railway-netlify-handoff-v1.1",
    "description": "Read-only API backed by a coherent immutable SQLite generation plus an atomic website-safe last-known-good catalog. No write endpoints exist."
  },
  "servers": [
    {
      "url": "http://127.0.0.1:8787",
      "description": "Local loopback runtime. Protected source/internal endpoints require their server-side API keys."
    },
    {
      "url": "https://REPLACE_WITH_RAILWAY_DOMAIN",
      "description": "Railway service origin after deployment approval. Do not embed this origin or protected API keys in browser code."
    }
  ],
  "x-thegate-access-origins": {
    "local_loopback_origin": "http://127.0.0.1:8787",
    "railway_origin_template": "https://REPLACE_WITH_RAILWAY_DOMAIN",
    "railway_website_path": "/v1/website/catalog",
    "netlify_same_origin_path": "/api/catalog",
    "note": "Netlify rewrites only the exact same-origin path to the Railway website path; it is not a wildcard API base."
  },
  "paths": {
    "/livez": {
      "get": {
        "summary": "Process liveness for Railway deployment",
        "security": [],
        "responses": {
          "200": {
            "description": "Process is accepting HTTP requests; data readiness is separate.",
            "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Liveness"}, "example": {"status": "alive"}}}
          },
          "400": {"$ref": "#/components/responses/BadRequest"}
        }
      }
    },
    "/health": {
      "get": {
        "summary": "Generic cache health",
        "security": [],
        "responses": {
          "200": {
            "description": "Usable cache, healthy or degraded.",
            "content": {
              "application/json": {
                "schema": {"$ref": "#/components/schemas/Health"},
                "examples": {
                  "healthy": {"value": {"status": "ok"}},
                  "stale": {"value": {"status": "degraded"}}
                }
              }
            }
          },
          "429": {
            "description": "Health rate limit exceeded.",
            "content": {
              "application/json": {
                "schema": {"$ref": "#/components/schemas/Health"},
                "example": {"status": "degraded"}
              }
            }
          },
          "503": {
            "description": "No usable coherent cache.",
            "content": {
              "application/json": {
                "schema": {"$ref": "#/components/schemas/Health"},
                "example": {"status": "unavailable"}
              }
            }
          }
        }
      }
    },
    "/v1/catalog/products": {
      "get": {
        "summary": "List publication-eligible website products",
        "security": [{"WebsiteApiKey": []}, {"InternalApiKey": []}],
        "parameters": [
          {"$ref": "#/components/parameters/Page"},
          {"$ref": "#/components/parameters/PageSize"}
        ],
        "responses": {
          "200": {
            "description": "Paginated public catalog.",
            "content": {
              "application/json": {"schema": {"$ref": "#/components/schemas/CatalogList"}}
            }
          },
          "400": {"$ref": "#/components/responses/BadRequest"},
          "401": {"$ref": "#/components/responses/Unauthorized"},
          "403": {"$ref": "#/components/responses/Forbidden"},
          "429": {"$ref": "#/components/responses/RateLimited"},
          "503": {"$ref": "#/components/responses/CacheUnavailable"}
        }
      }
    },
    "/v1/website/catalog": {
      "get": {
        "summary": "Complete public website catalog merged from KiotViet and WEBSITE_PRODUCTS",
        "description": "No API key. Intended only behind the exact same-origin Netlify rewrite /api/catalog.",
        "security": [],
        "responses": {
          "200": {
            "description": "Validated website last-known-good catalog whose generated_at and Kiot source_data_as_of are both within their configured freshness limits.",
            "headers": {
              "ETag": {"schema": {"type": "string"}},
              "Cache-Control": {"schema": {"type": "string"}}
            },
            "content": {
              "application/json": {
                "schema": {"$ref": "#/components/schemas/WebsiteCatalog"},
                "example": {
                  "schema_version": "the_gate_website_catalog.v1",
                  "generated_at": "2042-03-14T03:00:00+00:00",
                  "source_data_as_of": "2042-03-14T02:00:00+00:00",
                  "total": 1,
                  "items": [{
                    "code": "SYNTHETIC-001",
                    "name": "Synthetic catalog item",
                    "slug": "synthetic-001",
                    "attributes": {"color": "Black", "size": "M"},
                    "images": ["https://static.example.invalid/catalog/synthetic-001.jpg"],
                    "sale_price": 299000,
                    "price_status": "available",
                    "availability": {"ton_that_thiep": "in_stock", "nguyen_trai": "out_of_stock", "tam_coc": "in_stock"},
                    "source_group": "Synthetic",
                    "category": "Jackets",
                    "audience": "Men",
                    "collection": null,
                    "display_order": 1,
                    "featured": false,
                    "data_as_of": "2042-03-14T02:00:00+00:00"
                  }]
                }
              }
            }
          },
          "304": {"description": "ETag matches If-None-Match; response body omitted."},
          "400": {"$ref": "#/components/responses/BadRequest"},
          "429": {"$ref": "#/components/responses/RateLimited"},
          "503": {"$ref": "#/components/responses/WebsiteCatalogUnavailable"}
        }
      }
    },
    "/v1/catalog/products/{code}": {
      "get": {
        "summary": "Get one publication-eligible product by exact code",
        "security": [{"WebsiteApiKey": []}, {"InternalApiKey": []}],
        "parameters": [{"$ref": "#/components/parameters/Code"}],
        "responses": {
          "200": {
            "description": "Public product.",
            "content": {
              "application/json": {
                "schema": {"$ref": "#/components/schemas/CatalogProduct"},
                "example": {
                  "code": "SYNTH-001",
                  "name": "Synthetic black jacket M",
                  "attributes": {"color": "Black", "size": "M"},
                  "images": ["https://static.example.invalid/catalog/synth-001.jpg"],
                  "sale_price": 299000,
                  "price_status": "available",
                  "availability": {
                    "ton_that_thiep": "in_stock",
                    "nguyen_trai": "out_of_stock",
                    "tam_coc": "in_stock"
                  },
                  "data_as_of": "2042-03-14T09:00:00+07:00",
                  "stale": false
                }
              }
            }
          },
          "400": {"$ref": "#/components/responses/BadRequest"},
          "401": {"$ref": "#/components/responses/Unauthorized"},
          "403": {"$ref": "#/components/responses/Forbidden"},
          "404": {"$ref": "#/components/responses/NotFound"},
          "429": {"$ref": "#/components/responses/RateLimited"},
          "503": {"$ref": "#/components/responses/CacheUnavailable"}
        }
      }
    },
    "/v1/internal/products": {
      "get": {
        "summary": "List internal valid records including products unavailable publicly",
        "security": [{"InternalApiKey": []}],
        "parameters": [
          {"$ref": "#/components/parameters/Page"},
          {"$ref": "#/components/parameters/PageSize"}
        ],
        "responses": {
          "200": {
            "description": "Paginated internal catalog.",
            "content": {
              "application/json": {"schema": {"$ref": "#/components/schemas/InternalList"}}
            }
          },
          "400": {"$ref": "#/components/responses/BadRequest"},
          "401": {"$ref": "#/components/responses/Unauthorized"},
          "403": {"$ref": "#/components/responses/Forbidden"},
          "429": {"$ref": "#/components/responses/RateLimited"},
          "503": {"$ref": "#/components/responses/CacheUnavailable"}
        }
      }
    },
    "/v1/internal/products/{code}": {
      "get": {
        "summary": "Get one internal product by exact code",
        "security": [{"InternalApiKey": []}],
        "parameters": [{"$ref": "#/components/parameters/Code"}],
        "responses": {
          "200": {
            "description": "Internal product including approved-branch inventory.",
            "content": {
              "application/json": {
                "schema": {"$ref": "#/components/schemas/InternalProduct"},
                "example": {
                  "code": "SYNTH-001",
                  "name": "Synthetic black jacket M",
                  "attributes": {"color": "Black", "size": "M"},
                  "images": ["https://static.example.invalid/catalog/synth-001.jpg"],
                  "sale_price": 299000,
                  "price_status": "available",
                  "availability": {
                    "ton_that_thiep": "in_stock",
                    "nguyen_trai": "out_of_stock",
                    "tam_coc": "in_stock"
                  },
                  "data_as_of": "2042-03-14T09:00:00+07:00",
                  "stale": false,
                  "inventory": {
                    "ton_that_thiep": 3,
                    "nguyen_trai": 0,
                    "tam_coc": 2
                  }
                }
              }
            }
          },
          "400": {"$ref": "#/components/responses/BadRequest"},
          "401": {"$ref": "#/components/responses/Unauthorized"},
          "403": {"$ref": "#/components/responses/Forbidden"},
          "404": {"$ref": "#/components/responses/NotFound"},
          "429": {"$ref": "#/components/responses/RateLimited"},
          "503": {"$ref": "#/components/responses/CacheUnavailable"}
        }
      }
    }
  },
  "components": {
    "securitySchemes": {
      "WebsiteApiKey": {
        "type": "apiKey",
        "in": "header",
        "name": "X-API-Key",
        "description": "Server-side website key; cannot access internal routes."
      },
      "InternalApiKey": {
        "type": "apiKey",
        "in": "header",
        "name": "X-API-Key",
        "description": "Privileged server-side key; never expose to browsers."
      }
    },
    "parameters": {
      "Page": {
        "name": "page",
        "in": "query",
        "required": false,
        "schema": {"type": "integer", "minimum": 1, "default": 1}
      },
      "PageSize": {
        "name": "page_size",
        "in": "query",
        "required": false,
        "schema": {"type": "integer", "minimum": 1, "maximum": 100, "default": 50}
      },
      "Code": {
        "name": "code",
        "in": "path",
        "required": true,
        "description": "Exact URL-encoded product code; maximum decoded length 200 and no slash.",
        "schema": {"type": "string", "minLength": 1, "maxLength": 200}
      }
    },
    "schemas": {
      "Liveness": {
        "type": "object",
        "additionalProperties": false,
        "required": ["status"],
        "properties": {"status": {"const": "alive"}}
      },
      "Health": {
        "type": "object",
        "additionalProperties": false,
        "required": ["status"],
        "properties": {"status": {"type": "string", "enum": ["ok", "degraded", "unavailable"]}}
      },
      "Error": {
        "type": "object",
        "additionalProperties": false,
        "required": ["error"],
        "properties": {"error": {"type": "string"}}
      },
      "Attributes": {
        "type": "object",
        "additionalProperties": false,
        "required": ["color", "size"],
        "properties": {
          "color": {"type": ["string", "null"]},
          "size": {"type": ["string", "null"]}
        }
      },
      "AvailabilityState": {
        "type": "string",
        "enum": ["in_stock", "out_of_stock", "unavailable"]
      },
      "Availability": {
        "type": "object",
        "additionalProperties": false,
        "required": ["ton_that_thiep", "nguyen_trai", "tam_coc"],
        "properties": {
          "ton_that_thiep": {"$ref": "#/components/schemas/AvailabilityState"},
          "nguyen_trai": {"$ref": "#/components/schemas/AvailabilityState"},
          "tam_coc": {"$ref": "#/components/schemas/AvailabilityState"}
        }
      },
      "Inventory": {
        "type": "object",
        "additionalProperties": false,
        "required": ["ton_that_thiep", "nguyen_trai", "tam_coc"],
        "properties": {
          "ton_that_thiep": {"type": ["number", "null"]},
          "nguyen_trai": {"type": ["number", "null"]},
          "tam_coc": {"type": ["number", "null"]}
        }
      },
      "CatalogProduct": {
        "type": "object",
        "additionalProperties": false,
        "required": ["code", "name", "attributes", "images", "sale_price", "price_status", "availability", "data_as_of", "stale"],
        "properties": {
          "code": {"type": "string"},
          "name": {"type": "string"},
          "attributes": {"$ref": "#/components/schemas/Attributes"},
          "images": {"type": "array", "items": {"type": "string", "format": "uri"}},
          "sale_price": {"type": ["number", "null"]},
          "price_status": {"type": "string", "enum": ["available", "unavailable", "zero", "invalid"]},
          "availability": {"$ref": "#/components/schemas/Availability"},
          "data_as_of": {"type": "string", "format": "date-time"},
          "stale": {"type": "boolean"}
        }
      },
      "InternalProduct": {
        "type": "object",
        "additionalProperties": false,
        "required": ["code", "name", "attributes", "images", "sale_price", "price_status", "availability", "data_as_of", "stale", "inventory"],
        "properties": {
          "code": {"type": "string"},
          "name": {"type": "string"},
          "attributes": {"$ref": "#/components/schemas/Attributes"},
          "images": {"type": "array", "items": {"type": "string", "format": "uri"}},
          "sale_price": {"type": ["number", "null"]},
          "price_status": {"type": "string", "enum": ["available", "unavailable", "zero", "invalid"]},
          "availability": {"$ref": "#/components/schemas/Availability"},
          "data_as_of": {"type": "string", "format": "date-time"},
          "stale": {"type": "boolean"},
          "inventory": {"$ref": "#/components/schemas/Inventory"}
        }
      },
      "CatalogList": {
        "type": "object",
        "additionalProperties": false,
        "required": ["items", "page", "page_size", "total", "data_as_of", "stale"],
        "properties": {
          "items": {"type": "array", "items": {"$ref": "#/components/schemas/CatalogProduct"}},
          "page": {"type": "integer", "minimum": 1},
          "page_size": {"type": "integer", "minimum": 1, "maximum": 100},
          "total": {"type": "integer", "minimum": 0},
          "data_as_of": {"type": "string", "format": "date-time"},
          "stale": {"type": "boolean"}
        }
      },
      "InternalList": {
        "type": "object",
        "additionalProperties": false,
        "required": ["items", "page", "page_size", "total", "data_as_of", "stale"],
        "properties": {
          "items": {"type": "array", "items": {"$ref": "#/components/schemas/InternalProduct"}},
          "page": {"type": "integer", "minimum": 1},
          "page_size": {"type": "integer", "minimum": 1, "maximum": 100},
          "total": {"type": "integer", "minimum": 0},
          "data_as_of": {"type": "string", "format": "date-time"},
          "stale": {"type": "boolean"}
        }
      },
      "WebsiteCatalogItem": {
        "type": "object",
        "additionalProperties": false,
        "required": ["code", "name", "slug", "attributes", "images", "sale_price", "price_status", "availability", "source_group", "category", "audience", "collection", "display_order", "featured", "data_as_of"],
        "properties": {
          "code": {"type": "string", "minLength": 1},
          "name": {"type": "string", "minLength": 1},
          "slug": {"type": "string", "pattern": "^[a-z0-9]+(?:-[a-z0-9]+)*$", "maxLength": 120},
          "attributes": {"$ref": "#/components/schemas/Attributes"},
          "images": {"type": "array", "minItems": 1, "maxItems": 1, "items": {"type": "string", "format": "uri", "pattern": "^https://"}},
          "sale_price": {"type": "number", "exclusiveMinimum": 0},
          "price_status": {"const": "available"},
          "availability": {"$ref": "#/components/schemas/Availability"},
          "source_group": {"type": ["string", "null"]},
          "category": {"type": ["string", "null"]},
          "audience": {"type": ["string", "null"]},
          "collection": {"type": ["string", "null"]},
          "display_order": {"type": ["integer", "null"], "minimum": 0},
          "featured": {"type": "boolean"},
          "data_as_of": {"type": "string", "format": "date-time"}
        }
      },
      "WebsiteCatalog": {
        "type": "object",
        "additionalProperties": false,
        "required": ["schema_version", "generated_at", "source_data_as_of", "total", "items"],
        "properties": {
          "schema_version": {"const": "the_gate_website_catalog.v1"},
          "generated_at": {"type": "string", "format": "date-time"},
          "source_data_as_of": {"type": "string", "format": "date-time"},
          "total": {"type": "integer", "minimum": 0, "maximum": 1000},
          "items": {"type": "array", "maxItems": 1000, "items": {"$ref": "#/components/schemas/WebsiteCatalogItem"}}
        }
      }
    },
    "responses": {
      "BadRequest": {
        "description": "Invalid request shape.",
        "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}, "example": {"error": "invalid_pagination"}}}
      },
      "Unauthorized": {
        "description": "API key missing.",
        "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}, "example": {"error": "authentication_required"}}}
      },
      "Forbidden": {
        "description": "API key wrong or insufficient role.",
        "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}, "example": {"error": "forbidden"}}}
      },
      "NotFound": {
        "description": "Route/code absent or code excluded from public catalog.",
        "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}, "example": {"error": "not_found"}}}
      },
      "RateLimited": {
        "description": "Rate limit exceeded.",
        "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}, "example": {"error": "rate_limited"}}}
      },
      "CacheUnavailable": {
        "description": "No usable coherent cache.",
        "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}, "example": {"error": "cache_unavailable"}}}
      },
      "WebsiteCatalogUnavailable": {
        "description": "No validated website LKG, or generated_at/source_data_as_of exceeds its configured age.",
        "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}, "example": {"error": "website_catalog_unavailable"}}}
      }
    }
  }
}
